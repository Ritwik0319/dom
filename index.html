<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            scroll-padding-top: 6vh;
            overflow-x: hidden;
        }

        /* html{
            scroll-padding-top: 6vh;
        } */

        .nav {
            display: flex;
            justify-content: space-between;
            background: rgb(237, 237, 237);
            height: 6vh;
            max-width: 100vw;
            font-size: 2rem;
            align-items: center;
            z-index: 1;
            top: 0;
            position: sticky;
            padding: 0 .5rem;
        }

        .nava {
            padding-left: 1rem;
            letter-spacing: .6rem;
        }

        .navb p {
            text-decoration: none;
            padding: 0 2rem 0 0;
            font-size: 1.2rem;
            font-weight: 100;
            letter-spacing: .4rem;
        }

        .hero {
            width: 99vw;
            height: 100vh;
            padding: 0 .5rem;
        }

        .project {
            margin: 4rem 0 1rem 2rem;
            font-size: 2rem;
            font-weight: 100;
        }

        .project_container {
            display: grid;
            grid-template-columns: auto auto auto auto;
            row-gap: 1rem;
            padding: 4rem 2rem;
        }

        .project_img {
            width: 23vw;
        }

        .project_child {
            position: relative;
        }

        .project_img_name {
            position: absolute;
            top: 0;
            left: 0;
            font-size: 1.2rem;
            color: white;
            background-color: black;
            padding: .5rem;
        }

        .abt_dis {
            padding: 2rem;
            font-size: 1.1rem;
            letter-spacing: .02rem;
            line-height: 1.4rem;
        }

        .abt_content {
            display: grid;
            grid-template-columns: auto auto auto auto;
            justify-content: space-around;
            padding: 2rem;
        }

        .abt_childImg {
            width: 23vw;
        }

        .abt_name {
            font-size: 1.8rem;
            margin: .8rem 0;
        }

        .abt_child_disc {
            margin: .5rem 0;
            font-size: 1.1rem;
            color: gray;
        }

        .abt_child_disc1 {
            font-size: 1.3rem;
            margin: .6rem 0;
        }

        .abt_contact {
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            background-color: rgb(236, 236, 236);
            margin-right: .5rem;
            padding: .5rem;
        }
        .contact_container{
            padding:2rem;
        }
        .contact_container_name{
            height: 3vw;
            width: 100%;
            font-size: 20px;
            border: 1px solid rgb(146, 145, 145);
            border-radius: 5px;
            color: rgb(146, 145, 145);
            padding: .5rem;
            margin: 1rem 0;
        }
        .contact_container_dis {
            font-size: 1.5rem;
            padding: 1rem 0;
        }

        .last_container {
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            background-color: black;
            height: 10vh;

        }

        /* For tablets (max-width: 768px) */
        @media screen and (max-width: 768px) {
            .nav {
                font-size: 1.5rem;
                height: 8vh;
                align-items: center;
            }

            .nava {
                padding-left: 0;
                letter-spacing: 0.3rem;
            }

            .navb p {
                font-size: 1rem;
                padding: 0.5rem;
                letter-spacing: 0.2rem;
            }

            .hero {
                width: 100vw;
                height: 50vh;
            }

            .project_container {
                grid-template-columns: auto auto;
                padding: 2rem 1rem;
            }

            .project_img {
                width: 45vw;
            }

            .abt_content {
                grid-template-columns: auto auto;
                padding: 2rem 1rem;
            }

            .abt_childImg {
                width: 40vw;
            }

            .abt_name {
                font-size: 1.5rem;
            }

            .abt_child_disc {
                font-size: 1rem;
            }

            .abt_child_disc1 {
                font-size: 1.1rem;
            }

            .abt_contact {
                font-size: 1rem;
            }

            .contact_container_dis {
                font-size: 1.2rem;
            }
            .contact_container_name{
                height: 4vh;
            }
        }

        /* For mobile devices (max-width: 480px) */
        @media screen and (max-width: 480px) {
            .nav {
                font-size: 1.2rem;
                height: auto;
                padding: 1rem 0.5rem;
            }

            .nava {
                letter-spacing: 0.2rem;
                font-size: 1rem;
            }

            .navb p {
                font-size: 0.8rem;
                padding: 0.2rem;
            }

            .hero {
                width: 100vw;
                height: 40vh;
            }

            .project {
                font-size: 1.5rem;
            }

            .project_container {
                grid-template-columns: auto;
                justify-content: center;
                padding: 1rem;
            }

            .project_img {
                width: 80vw;
            }

            .abt_content {
                grid-template-columns: auto;
                padding: 1rem;
                text-align: center;
            }

            .abt_childImg {
                width: 80vw;
            }

            .abt_name {
                font-size: 1.2rem;
            }

            .abt_child_disc {
                font-size: 0.9rem;
            }

            .abt_child_disc1 {
                font-size: 1rem;
            }

            .abt_contact {
                font-size: 0.9rem;
                margin-bottom: 10px;
            }

            .contact_container_dis {
                font-size: 1rem;
            }

            .last_container {
                font-size: 0.8rem;
                padding: 1rem;
                height: auto;
            }
        }
    </style>
</head>

<body>
    <script>

        // navbar---------------


        nav = document.createElement("div");
        nav.classList.add("nav");

        nava = document.createElement("div");
        nava.innerText = "BR Architects";
        nava.classList.add("nava");

        navb = document.createElement("div");
        navb.classList.add("nav", 'navb');

        navb1 = document.createElement("p");
        navb2 = document.createElement("p");
        navb3 = document.createElement("p");

        navb1.innerText = "Projects";
        navb2.innerText = "About";
        navb3.innerText = "Contact";



        // Hero---------------

        hero = document.createElement("img");
        hero.setAttribute("src", "https://www.w3schools.com/w3images/architect.jpg");
        hero.classList.add("hero");


        // project-------


        project = document.createElement("h6");
        project.innerText = "Projects";
        project.classList.add("project");

        project_container = document.createElement("div");

        let project_imgs = ["https://www.w3schools.com/w3images/house5.jpg",
            "https://www.w3schools.com/w3images/house2.jpg",
            "https://www.w3schools.com/w3images/house3.jpg",
            "https://www.w3schools.com/w3images/house4.jpg",
            "https://www.w3schools.com/w3images/house2.jpg",
            "https://www.w3schools.com/w3images/house5.jpg",
            "https://www.w3schools.com/w3images/house4.jpg",
            "https://www.w3schools.com/w3images/house3.jpg"];

        let proj_img_names = ["Summer House", "Brick House", "Renovated", "Barn House", "Summer House", "Brick House", "Renovated", "Barn House"];

        for (i = 0; i < project_imgs.length; i++) {
            project_childs = document.createElement("div");
            project_container.append(project_childs);

            project_img = document.createElement("img");
            project_img.src = project_imgs[i];

            project_img_name = document.createElement("p");
            project_img_name.innerText = proj_img_names[i];

            project_childs.append(project_img, project_img_name);

            project_img.classList.add("project_img");
            project_container.classList.add("project_container");
            project_childs.classList.add("project_child");
            project_img_name.classList.add("project_img_name");
        }




        // about---------------


        about = document.createElement("h6");
        about.innerText = "About";
        about.classList.add("project");

        abt_dis = document.createElement("p");
        abt_dis.innerText = "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.";
        abt_dis.classList.add("abt_dis");

        about_container = document.createElement("div");
        abt_content = document.createElement("div");
        abt_content.classList.add("abt_content");
        
        




        let abt_img = ["https://www.w3schools.com/w3images/team2.jpg",
            "https://www.w3schools.com/w3images/team1.jpg",
            "https://www.w3schools.com/w3images/team3.jpg",
            "https://www.w3schools.com/w3images/team4.jpg"];

        
            let abt_names = ["John Doe", "Jane Doe", "Mike Ross", "Dan Star"]
        
        let abt_childs_disc = ["CEO & Founder", "Architect", "Architect", "Architect"];
        
        let abt_childs_disc1 = ["Phasellus eget enim eu lectus faucibus vestibulum. Suspendisse sodales pellentesque elementum.", "Phasellus eget enim eu lectus faucibus vestibulum. Suspendisse sodales pellentesque elementum.", "Phasellus eget enim eu lectus faucibus vestibulum. Suspendisse sodales pellentesque elementum.", "Phasellus eget enim eu lectus faucibus vestibulum. Suspendisse sodales pellentesque elementum."];
        
        let abt_contacts = ["Contact", "Contact", "Contact", "Contact"]


        for (i = 0; i < abt_img.length; i++) {
            abt_child = document.createElement("div");
            abt_childImg = document.createElement("img");
            abt_name = document.createElement("p");
            abt_child_disc = document.createElement("p")
            abt_child_disc1 = document.createElement("p")
            abt_contact = document.createElement("p")


            abt_content.append(abt_child);
            abt_child.append(abt_childImg);
            abt_child.append(abt_name);
            abt_child.append(abt_name);
            abt_child.append(abt_child_disc);
            abt_child.append(abt_child_disc1);
            abt_child.append(abt_contact);


            abt_childImg.src = abt_img[i];
            abt_name.innerText = abt_names[i];
            abt_child_disc.innerText = abt_childs_disc[i];
            abt_child_disc1.innerText = abt_childs_disc1[i];
            abt_contact.innerText = abt_contacts[i];


            abt_childImg.classList.add("abt_childImg");
            abt_name.classList.add("abt_name");
            abt_child_disc.classList.add("abt_child_disc");
            abt_child_disc1.classList.add("abt_child_disc1");
            abt_contact.classList.add("abt_contact");
        }
        
        
        // contact---------
        
        contact = document.createElement("h6");
        contact.innerText = "Contact";
        contact.classList.add("project");

        contact_container = document.createElement("div");
        contact_container.classList.add("contact_container")

        contact_container_dis = document.createElement("p");
        contact_container_dis.innerText = "Lets get in touch and talk about your next project."
        contact_container_dis.classList.add("contact_container_dis")


        contact_container_name = document.createElement("input");
        contact_container_name.setAttribute("placeholder","Name")
        contact_container_name.classList.add("contact_container_name")

        contact_container_email = document.createElement("input");
        contact_container_email.setAttribute("placeholder","Email")
        contact_container_email.classList.add("contact_container_name")

        contact_container_subject = document.createElement("input");
        contact_container_subject.setAttribute("placeholder","Subject")
        contact_container_subject.classList.add("contact_container_name")

        contact_container_comment = document.createElement("input");
        contact_container_comment.setAttribute("placeholder","Comment")
        contact_container_comment.classList.add("contact_container_name")
        
        
        console.log(contact_container);
        
        
        
        // footer------

        last_container = document.createElement("div")
        last_container.innerText = "Powered by w3.css"
        last_container.classList.add("last_container")


        nav.append(nava, navb)
        navb.append(navb1, navb2, navb3)
        about_container.append(abt_dis, abt_content)
        contact_container.append(contact_container_dis, contact_container_name,contact_container_email,contact_container_subject,contact_container_comment)
        document.body.append(nav, hero, project, project_container, about, about_container, contact, contact_container,last_container);
    </script>
</body>

</html>
